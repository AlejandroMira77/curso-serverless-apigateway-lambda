AWSTemplateFormatVersion: '2010-09-09'
Metadata:
  Author: Antonella Mira
  Description: Plantilla para la creación de una API REST
  Version: '1.0'
Parameters:
  pNameProject:
    Description: "Parameter with the name of the project"
    Type: String
    MinLength: 3
    MaxLength: 15
    Default: NameProjectDef
  pTimestamp:
    Description: "Parameter with the timestamp to force the deployment"
    Type: String
Resources:
  ApiRestGateway:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: 'first-api-cloudformation'
      Description: !Sub 'API creada con cloudformation - ${pTimestamp}'
      Body:
        Fn::Transform:
          Name: AWS::Include
          Parameters:
            Location: 'api-pets.yaml'
  DeploymentApiRest:
    Type: AWS::ApiGateway::Deployment
    Properties:
      Description: !Sub 'Etapa de desarrollo - ${pTimestamp}'
      RestApiId: !Ref ApiRestGateway
      StageName: 'development'
  RoleFunctionLambda:
    Type: AWS::IAM::Role
    Properties:
      RoleName: role-lambda-api
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
  LambdaFunctionAPI:
    Type: AWS::Lambda::Function
    Properties:
      Architectures: # arquitectura del procesador
        - x86_64
      Code: 
        ZipFile: |
          import json
          import uuid
          from datetime import datetime

          pets: list = []

          def handler(event: dict, context):
              method = event.get("httpMethod")

              if method == "POST":
                  try:
                      body = json.loads(event.get("body", "{}"))
                      new_pet = {
                          "id": str(uuid.uuid4()),
                          "name": body.get("name"),
                          "type": body.get("type"),
                          "age": body.get("age"),
                          "created_at": datetime.utcnow().isoformat()
                      }

                      if not new_pet["name"] or not new_pet["type"] or new_pet["age"] is None:
                          return {
                              "statusCode": 400,
                              "body": json.dumps({"message": "Data missing of the pet"})
                          }
                      
                      pets.append(new_pet)

                      return {
                          "statusCode": 201,
                          "body": json.dumps({
                              "message": "Pet registered successfully",
                              "data": new_pet
                          })
                      }

                  except Exception as e:
                      return {
                          "statusCode": 500,
                          "body": json.dumps({"message": "Internal server error", "error": str(e)})
                      }

              elif method == "GET":
                  return {
                      "statusCode": 200,
                      "body": json.dumps({
                          "message": "Pets list",
                          "data": pets
                      })
                  }

              else:
                  return {
                      "statusCode": 405,
                      "body": json.dumps({"message": "Method not allowed :c"})
                  }
            
      Description: Esta lambda devuelve un hola mundo y la variable de entorno
      Environment:
        Variables:
          PROJECT: !Ref pNameProject
      EphemeralStorage: # todas las funciones lambdas tienen acceso a un directorio
        Size: 512
      FunctionName: lambda-apigateway-code-template
      Handler: index.handler
      MemorySize: 128
      PackageType: Zip
      RecursiveLoop: Terminate
      Role: !GetAtt RoleFunctionLambda.Arn
      Runtime: python3.13
      Tags:
        - Key: "Project"
          Value: "Udemy course of AWS Development serverless"
      Timeout: 60
  LambdaPermissionApiGateway:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LambdaFunctionAPI
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub: "arn:aws:execute-api:us-east-1:${AWS::AccountId}:${ApiRestGateway}/*/*/*"