AWSTemplateFormatVersion: '2010-09-09'
Metadata:
  Author: Antonella Mira
  Description: Plantilla para la creación de una API REST
  Version: '1.0'
Parameters:
  pNameProject:
    Description: Parameter with the name of the project
    Type: String
    MinLength: 3
    MaxLength: 15
    Default: NameProjectDef
  pTimestamp:
    Description: Parameter with the timestamp to force the deployment
    Type: String
Resources:
  ApiRestGateway:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: first-api-cloudformation
      Description:
        Fn::Sub: API creada con cloudformation - ${pTimestamp}
      Body:
        Fn::Transform:
          Name: AWS::Include
          Parameters:
            Location: s3://antonella-course-us-east-1/84f61ca65789239eb3f99abb6438be43
  DeploymentApiRest:
    Type: AWS::ApiGateway::Deployment
    Properties:
      Description:
        Fn::Sub: Etapa de desarrollo - ${pTimestamp}
      RestApiId:
        Ref: ApiRestGateway
      StageName: development
  RoleFunctionLambda:
    Type: AWS::IAM::Role
    Properties:
      RoleName: role-lambda-api
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
  LambdaFunctionAPI:
    Type: AWS::Lambda::Function
    Properties:
      Architectures:
      - x86_64
      Code:
        ZipFile: "import json\nimport uuid\nfrom datetime import datetime\n\npets:\
          \ list = []\n\ndef handler(event: dict, context):\n    method = event.get(\"\
          httpMethod\")\n\n    if method == \"POST\":\n        try:\n            body\
          \ = json.loads(event.get(\"body\", \"{}\"))\n            new_pet = {\n \
          \               \"id\": str(uuid.uuid4()),\n                \"name\": body.get(\"\
          name\"),\n                \"type\": body.get(\"type\"),\n              \
          \  \"age\": body.get(\"age\"),\n                \"created_at\": datetime.utcnow().isoformat()\n\
          \            }\n\n            if not new_pet[\"name\"] or not new_pet[\"\
          type\"] or new_pet[\"age\"] is None:\n                return {\n       \
          \             \"statusCode\": 400,\n                    \"body\": json.dumps({\"\
          message\": \"Data missing of the pet\"})\n                }\n          \
          \  \n            pets.append(new_pet)\n\n            return {\n        \
          \        \"statusCode\": 201,\n                \"body\": json.dumps({\n\
          \                    \"message\": \"Pet registered successfully\",\n   \
          \                 \"data\": new_pet\n                })\n            }\n\
          \n        except Exception as e:\n            return {\n               \
          \ \"statusCode\": 500,\n                \"body\": json.dumps({\"message\"\
          : \"Internal server error\", \"error\": str(e)})\n            }\n\n    elif\
          \ method == \"GET\":\n        return {\n            \"statusCode\": 200,\n\
          \            \"body\": json.dumps({\n                \"message\": \"Pets\
          \ list\",\n                \"data\": pets\n            })\n        }\n\n\
          \    else:\n        return {\n            \"statusCode\": 405,\n       \
          \     \"body\": json.dumps({\"message\": \"Method not allowed :c\"})\n \
          \       }\n  \n"
      Description: Esta lambda devuelve un hola mundo y la variable de entorno
      Environment:
        Variables:
          PROJECT:
            Ref: pNameProject
      EphemeralStorage:
        Size: 512
      FunctionName: lambda-apigateway-code-template
      Handler: index.handler
      MemorySize: 128
      PackageType: Zip
      RecursiveLoop: Terminate
      Role:
        Fn::GetAtt:
        - RoleFunctionLambda
        - Arn
      Runtime: python3.13
      Tags:
      - Key: Project
        Value: Udemy course of AWS Development serverless
      Timeout: 60
  LambdaPermissionApiGateway:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: LambdaFunctionAPI
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub: arn:aws:execute-api:us-east-1:${AWS::AccountId}:${ApiRestGateway}/*/*/*
